name: 編譯 iPhone App

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 XcodeGen
        run: brew install xcodegen

      - name: 產生 Xcode 專案
        run: xcodegen generate

      - name: 編譯（不簽章）
        run: |
          xcodebuild \
            -project ConvoAware.xcodeproj \
            -scheme ConvoAware \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ConvoAware.app Payload/
          zip -qry ConvoAware.ipa Payload

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: ConvoAware-ipa
          path: ConvoAware.ipa
